<!DOCTYPE html>
<html>

<head>
	<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
	<meta charset="utf-8"/>
	<title>Настройки гирлянды</title>
	<link rel="stylesheet" type="text/css" href="s.css?v2">
	<script>
document.addEventListener("DOMContentLoaded", start);

function start() {
	document.getElementById('neofeature').value = '{{neofeature}}';
	document.getElementById('nightEnabled').checked = '{{nightEnabled}}' === '1';
}
	</script>
</head>

<body>
	<div style='text-align:left;display:inline-block;width:320px;padding:5px'>
		<form method='post' action='/setup'>
			<label>Яркость (1..255)
				<input type='number' min='1' max='255' id='brigthness' name='brightness' placeholder='Яркость' value='{{brightness}}'>
			</label>
			<br><hr>
			<label>К-во светодиодов
				<input type='number' min='1' max='1024' id='leds' name='leds' placeholder='К-во светодиодов' value='{{leds}}'>
			</label>
			<label>Конфигурация LED
				<select id="neofeature" name="neofeature">
					<option value="0">RGB</option>
					<option value="1">GRB</option>
					<option value="2">RBG</option>
					<option value="3">RGBW</option>
					<option value="4">GRBW</option>
					<option value="5">BRG</option>
					<option value="6">BGR</option>
				</select>
			</label>
			<br><hr>
			<label><input type='checkbox' id='nightEnabled' name='nightEnabled' value='1'>Ночной режим</label>
			<label>Начало (час, 0..23)
				<input type='number' min='0' max='23' name='nightStartHour' value='{{nightStartHour}}'>
			</label>
			<label>Конец (час, 0..23)
				<input type='number' min='0' max='23' name='nightEndHour' value='{{nightEndHour}}'>
			</label>
			<label>Эффект ночью (номер)
				<input type='number' min='0' max='9' name='nightAnim' value='{{nightAnim}}'>
			</label>
			<label>Яркость ночью (0..255)
				<input type='number' min='0' max='255' name='nightBrightness' value='{{nightBrightness}}'>
			</label>
			<br><br>

			<button type='submit'>Применить</button>
		</form>
		<br>
		<a href="javascript:history.back()">Назад</a> |
		<a href="/">Домой</a>
	</div>
</body>

</html>
