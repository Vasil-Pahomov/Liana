; PlatformIO Project Configuration File
;
; Board environments extend the [esp] section. Device-specific settings (OTA password and upload IPs,
; feature flags such as -DSUPPORT_BUTTON=1, AP SSID) live in platformio_local.ini, which is not
; committed; see platformio_local.ini.example.
;
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = nodemcuv2
extra_configs = platformio_local.ini

[env]
check_tool = cppcheck, clangtidy
check_skip_packages = yes

; common settings of all ESP boards
[esp]
framework = arduino
lib_deps =
	makuna/NeoPixelBus@^2.7.1
	links2004/WebSockets@^2.3.2
	bblanchon/ArduinoJson@^7.2.0
	knolleary/PubSubClient@^2.8
	r-downing/PersWiFiManager@^5.0.0
	ropg/ezTime@^0.8.3
monitor_speed = 115200
upload_speed = 921600

[env:nodemcuv2]
extends = esp
platform = espressif8266
board = nodemcuv2
board_build.ldscript = eagle.flash.2m1m.ld
monitor_filters = esp8266_exception_decoder

[env:esp01s]
extends = esp
platform = espressif8266
board = esp01
board_build.flash_mode = dout
board_build.ldscript = eagle.flash.512k64.ld
monitor_filters = esp8266_exception_decoder

[env:d1_mini]
extends = esp
platform = espressif8266
board = d1_mini
monitor_filters = esp8266_exception_decoder

[env:esp32dev]
extends = esp
platform = espressif32
board = esp32dev

; Host-side unit tests of the Arduino-free parts (color, palette, masks, cycling): pio test -e native
[env:native]
platform = native
test_framework = unity
build_flags = -std=c++11 -Isrc
test_build_src = no
